version: '3.12'

services:
  postgres:
    image: postgres:17
    container_name: ai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB not set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER not set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER not set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ai_network

  redis:
    image: redis:8
    container_name: ai_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD not set in .env}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD not set in .env}"
    networks:
      - ai_network

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    networks:
      - ai_network
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL not set in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD not set in .env}
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      - postgres

  bot:
    build: .
    container_name: ai_project_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=production
    env_file:
      - .env
    restart: always
    networks:
      - ai_network
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    # 启动前先跑迁移建表（含 PipelineRun），再启动 bot。
    # 用 sh -c 串起：迁移成功才启动；迁移失败则容器退出（restart: always 会重试）。
    command: >
      sh -c "alembic upgrade head && python -m app.bot.main"

networks:
  ai_network:
    driver: bridge

volumes:
  postgres_data: